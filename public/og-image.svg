<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Soft Aurora radial glows -->
    <radialGradient id="auroraBlue" cx="20%" cy="10%" r="50%">
      <stop offset="0%" stop-color="#0b6bf0" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#050a14" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auroraPink" cx="80%" cy="10%" r="50%">
      <stop offset="0%" stop-color="#d6347f" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#050a14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#101c33" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0a1424" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0b6bf0"/>
      <stop offset="40%" stop-color="#7a45f5"/>
      <stop offset="75%" stop-color="#d6347f"/>
      <stop offset="100%" stop-color="#ffb840"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5aa9ff"/>
      <stop offset="40%" stop-color="#b794ff"/>
      <stop offset="75%" stop-color="#ff7ab5"/>
      <stop offset="100%" stop-color="#ffc866"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="#050a14"/>
  <rect width="1200" height="630" fill="url(#auroraBlue)"/>
  <rect width="1200" height="630" fill="url(#auroraPink)"/>

  <!-- Ambient Grid (4% opacity) -->
  <g opacity="0.04" stroke="#9aaccb" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="490" x2="1200" y2="490"/>
    <line x1="0" y1="560" x2="1200" y2="560"/>
    <line x1="150" y1="0" x2="150" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="450" y1="0" x2="450" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="750" y1="0" x2="750" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1050" y1="0" x2="1050" y2="630"/>
  </g>

  <!-- Inner Glass Card -->
  <rect x="80" y="75" width="1040" height="480" rx="32" fill="url(#cardGrad)" stroke="rgba(143,163,192,0.18)" stroke-width="2"/>

  <!-- Logo Brand Lockup -->
  <g transform="translate(140, 135)">
    <rect width="48" height="48" rx="14" fill="#0a1424" stroke="rgba(10,132,255,0.4)" stroke-width="2"/>
    <path d="M26 12 L16 28 L23 28 L20 38 L32 22 L25 22 Z" fill="url(#brandGrad)"/>
    <text x="64" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="28" fill="#f2f7ff">
      SmartToolHub<tspan fill="#0a84ff">.</tspan>
    </text>
  </g>

  <!-- Tagline / Eyebrow -->
  <text x="140" y="240" font-family="'Geist Mono', monospace" font-size="16" letter-spacing="3" fill="#5aa9ff" text-transform="uppercase">
    FREE EVERYDAY AI TOOLS · SUB-30 SECONDS
  </text>

  <!-- Big Display Headline -->
  <text x="140" y="320" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="64" fill="#f2f7ff" letter-spacing="-2">
    Free AI tools that just work.
  </text>

  <!-- Subheadline -->
  <text x="140" y="380" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="24" fill="#9aaccb">
    No sign-up. Results in seconds. Designed for everyday phone &amp; desktop utility.
  </text>

  <!-- Feature Badge Chips -->
  <g transform="translate(140, 440)">
    <rect width="180" height="44" rx="22" fill="#0a1424" stroke="rgba(10,132,255,0.3)" stroke-width="1.5"/>
    <text x="90" y="27" font-family="'Geist Mono', monospace" font-size="14" fill="#0a84ff" text-anchor="middle" font-weight="600">
      Zero Registration
    </text>

    <rect x="200" width="180" height="44" rx="22" fill="#0a1424" stroke="rgba(139,92,246,0.3)" stroke-width="1.5"/>
    <text x="290" y="27" font-family="'Geist Mono', monospace" font-size="14" fill="#8b5cf6" text-anchor="middle" font-weight="600">
      Sub-30s Latency
    </text>

    <rect x="400" width="180" height="44" rx="22" fill="#0a1424" stroke="rgba(255,79,154,0.3)" stroke-width="1.5"/>
    <text x="490" y="27" font-family="'Geist Mono', monospace" font-size="14" fill="#ff4f9a" text-anchor="middle" font-weight="600">
      100% Private
    </text>
  </g>
</svg>
