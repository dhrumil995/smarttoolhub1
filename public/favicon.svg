<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1e1e38"/>
      <stop offset="100%" stop-color="#050713"/>
    </radialGradient>

    <!-- Blue Diamond Gradient -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0a84ff"/>
      <stop offset="100%" stop-color="#0055d4"/>
    </linearGradient>

    <!-- Pink/Magenta Diamond Gradient -->
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff75b5"/>
      <stop offset="50%" stop-color="#ff4f9a"/>
      <stop offset="100%" stop-color="#d91b6e"/>
    </linearGradient>

    <!-- Amber Accent Glow -->
    <radialGradient id="amberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb840" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffb840" stop-opacity="0"/>
    </radialGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.55"/>
    </filter>

    <filter id="glassRim">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#ffffff" flood-opacity="0.4" result="rim"/>
    </filter>
  </defs>

  <!-- Squircle Canvas Background -->
  <rect width="512" height="512" rx="114" fill="url(#bgGlow)"/>
  <rect width="510" height="510" x="1" y="1" rx="113" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="2"/>

  <!-- Aurora ambient glow behind shapes -->
  <ellipse cx="200" cy="220" rx="140" ry="140" fill="#0a84ff" opacity="0.35" filter="blur(40px)"/>
  <ellipse cx="320" cy="290" rx="140" ry="140" fill="#ff4f9a" opacity="0.35" filter="blur(40px)"/>
  <ellipse cx="260" cy="256" rx="80" ry="80" fill="url(#amberGlow)" opacity="0.3"/>

  <!-- Top Blue Diamond (Shortcuts Rhombus) -->
  <g transform="translate(196, 150) rotate(45)" filter="url(#softShadow)">
    <rect x="-82" y="-82" width="164" height="164" rx="38" fill="url(#blueGrad)"/>
    <rect x="-81" y="-81" width="162" height="162" rx="37" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="2"/>
    <!-- Specular highlight bar -->
    <path d="M -60 -70 L 60 -70" stroke="rgba(255,255,255,0.5)" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Overlapping Pink Diamond -->
  <g transform="translate(316, 270) rotate(45)" filter="url(#softShadow)">
    <rect x="-82" y="-82" width="164" height="164" rx="38" fill="url(#pinkGrad)"/>
    <rect x="-81" y="-81" width="162" height="162" rx="37" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
    <!-- Specular highlight bar -->
    <path d="M -60 -70 L 60 -70" stroke="rgba(255,255,255,0.45)" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Central Blend / Energy Node (Amber Sparks) -->
  <circle cx="256" cy="256" r="14" fill="#ffffff" opacity="0.95" filter="drop-shadow(0 0 10px #ffb840)"/>
  <circle cx="256" cy="256" r="6" fill="#ffb840"/>

  <!-- Subtle lightning bolt icon inside the node -->
  <path d="M 255 249 L 252 256 L 257 256 L 254 263 L 260 254 L 256 254 Z" fill="#050713"/>
</svg>
